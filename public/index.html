<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwordMasters Companion Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B111E;--card:#121A2E;--line:#1f2a44;--gold:#FFBE0B;--blue:#00B4D8;--accent-cyan:#00B4D8;--text:#e6e9f5;--mute:#8890ab;--bad:#ff5d73}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 400px at 80% -10%,rgba(0,180,216,.12),transparent),var(--bg);color:var(--text);font:15px/1.5 Inter,sans-serif;min-height:100vh}
.shell{padding-left:72px}
main{max-width:1680px;margin:0 auto;padding:24px 32px 60px}
h1,h2,h3{font-family:Orbitron,sans-serif;margin:0}
h1{font-size:clamp(22px,4vw,34px);font-weight:900;letter-spacing:.04em;color:var(--gold);text-shadow:0 0 18px rgba(255,190,11,.35)}
h1 span{color:var(--blue);text-shadow:0 0 18px rgba(0,180,216,.35)}
h3{font-size:14px;color:var(--blue);margin-bottom:12px;letter-spacing:.06em}
h4{margin:16px 0 8px;font:600 11px Orbitron,sans-serif;color:var(--mute);letter-spacing:.15em}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hidden{display:none}
main>section{animation:fade .35s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}}

/* sidebar */
.side{position:fixed;inset:0 auto 0 0;width:72px;z-index:50;background:#0e1626;border-right:1px solid var(--line);padding:16px 12px;overflow:hidden;transition:width .25s ease,box-shadow .25s}
.side:hover,.side:focus-within{width:248px;box-shadow:12px 0 40px rgba(0,0,0,.5)}
.logo{display:flex;align-items:center;gap:14px;height:48px;padding:0 14px;font:900 13px Orbitron,sans-serif;color:var(--gold);white-space:nowrap}
.logo b{font-size:20px;flex:none;width:20px;text-align:center}
.sidenav{display:flex;flex-direction:column;gap:10px;margin:24px 0 0}
.sidenav button{display:flex;align-items:center;gap:14px;width:100%;height:48px;padding:0 14px;background:var(--card);color:var(--mute);border:1px solid var(--line);border-left:4px solid transparent;border-radius:999px;font:600 13px Orbitron,sans-serif;white-space:nowrap;cursor:pointer;transition:.2s}
.sidenav button i{font-style:normal;flex:none;width:20px;text-align:center;font-size:16px;margin-left:-6px}
.sidenav button:hover,.sidenav button[aria-selected=true]{background:rgba(0,180,216,.1);color:var(--text);box-shadow:0 0 18px rgba(0,180,216,.18)}
.sidenav button[aria-selected=true]{border-left-color:var(--accent-cyan);box-shadow:0 0 18px rgba(0,180,216,.18),inset 6px 0 14px -8px var(--accent-cyan)}
.sidenav button[aria-selected=true] i{color:var(--accent-cyan)}

/* inputs */
.search{display:flex;gap:10px;margin-bottom:6px}
input[type=text],input[type=number],select{background:#0a0f1b;border:1px solid var(--line);border-radius:8px;color:var(--text);font:500 15px Inter,sans-serif;padding:12px 14px;min-width:0}
input[type=text]{flex:1;font-size:16px;padding:14px 16px}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,180,216,.15)}
.go{background:var(--gold);color:#1a1300;border:0;border-radius:8px;font:700 14px Orbitron,sans-serif;padding:0 26px;cursor:pointer;box-shadow:0 0 20px rgba(255,190,11,.3)}
.go:disabled{opacity:.5;cursor:wait}
.go.alt{background:transparent;color:var(--gold);border:1px solid var(--gold);box-shadow:none}
.banner{margin-top:14px;padding:12px 16px;border-radius:8px;border:1px solid var(--bad);background:rgba(255,93,115,.1);color:#ffb3be}
.loading{margin-top:18px;color:var(--blue);display:flex;gap:10px;align-items:center}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}

/* sub-tabs + advisor bar */
.subtabs{display:flex;gap:24px;margin:0 0 24px;border-bottom:1px solid var(--line)}
.subtabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);font:600 13px Orbitron,sans-serif;padding:10px 4px;cursor:pointer}
.subtabs button.on{color:var(--accent-cyan);border-color:var(--accent-cyan)}
.ibar{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-bottom:24px}
.ibar label{display:flex;flex-direction:column;gap:6px;flex:1 1 150px;font-size:11px;color:var(--mute);letter-spacing:.08em}
.ibar label:first-child{flex:2 1 220px}
.ibar input,.ibar select{width:100%;height:46px;padding:0 14px}
.ibar .go{height:46px}

/* cards + shared */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
.card.gold h3{color:var(--gold)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border:0}.kv b{font-weight:600;text-align:right}.kv span{color:var(--mute)}
.empty{color:var(--mute)}
.note{font-size:12.5px;color:var(--mute);margin-top:10px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:500}
#cout td,#cout th{text-align:center}.win{color:var(--gold);font-weight:700;text-shadow:0 0 10px rgba(255,190,11,.35)}
.tbl{overflow:auto;margin-top:10px;font-size:13px}
details{margin-top:18px}summary{cursor:pointer;color:var(--mute)}
.who h2{font-size:20px;margin:20px 0 4px}

/* profile */
.hero{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:12px}
.tile{position:relative;overflow:hidden;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,var(--card)),var(--card));border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;padding:14px;text-align:center}
.tile small{color:var(--mute);letter-spacing:.15em;font-size:11px}
.tile b{display:block;font:800 clamp(20px,3vw,26px) Orbitron,sans-serif;color:var(--c);margin-top:4px;text-shadow:0 0 14px var(--c)}
.bar{height:5px;border-radius:3px;background:#0a0f1b;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c);box-shadow:0 0 8px var(--c)}
.mini{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-top:10px}
.mini div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.mini small{display:block;color:var(--mute);font-size:10.5px;letter-spacing:.14em}.mini b{font:700 16px Orbitron,sans-serif}
.inv{display:flex;flex-wrap:wrap;gap:10px}
.it{position:relative;width:176px;min-height:150px;margin-top:10px;padding:12px 10px 10px;background:#0f1628;border:1px solid var(--rc);border-top:4px solid var(--rc);border-radius:8px}
.it.eq{box-shadow:0 0 14px var(--rc)}
.it .top{display:flex;justify-content:space-between;font:700 10px Orbitron,sans-serif;color:var(--rc)}
.it .lv{background:#0a0f1b;border:1px solid var(--line);color:var(--text);padding:0 6px;border-radius:4px}
.it .nm{font:700 13px Orbitron,sans-serif;margin:10px 0 4px}
.it .st{font-size:11.5px;color:var(--mute);margin-bottom:8px}
.it .eqt{position:absolute;top:-9px;left:10px;background:var(--bg);padding:0 6px;border-radius:4px;font:700 9px Orbitron,sans-serif;color:var(--gold)}
.it .x{position:absolute;top:-9px;right:10px;background:var(--bg);font:700 11px Orbitron,sans-serif;color:var(--rc);border:1px solid var(--rc);border-radius:4px;padding:0 6px}
.sls{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}
.sl{border:1px dashed var(--line);border-radius:6px;padding:4px 2px;text-align:center;opacity:.4}
.sl.on{opacity:1;border:1px solid var(--e);background:color-mix(in srgb,var(--e) 12%,transparent)}
.sl span{display:block;font-size:9px;color:var(--mute)}.sl.on span{color:var(--e)}.sl b{font:700 12px Orbitron,sans-serif}

/* gear / quest / armor cards */
.cg{display:grid;gap:24px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:16px}
.gc{background:linear-gradient(180deg,color-mix(in srgb,var(--g) 10%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--g) 55%,var(--line));border-radius:12px;padding:14px;box-shadow:0 0 18px color-mix(in srgb,var(--g) 26%,transparent)}
.gh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.gn{font:700 14px Orbitron,sans-serif;line-height:1.3}
.gr{font:700 9px Orbitron,sans-serif;color:var(--g);border:1px solid var(--g);border-radius:4px;padding:1px 6px;letter-spacing:.1em;white-space:nowrap}
.gw{color:var(--g);font-size:11px;margin-top:3px;letter-spacing:.08em}
.gs{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:12px}
.gs small{display:block;color:var(--mute);font-size:10px;letter-spacing:.1em}.gs b{font:700 14px Orbitron,sans-serif}
.gd{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px;font-size:12px}
.dl{display:flex;justify-content:space-between;gap:10px;padding:2px 0}.dl b{font-weight:600}

/* combat */
.ws{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:12px}
.wc{background:#0f1628;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.wc h5{margin:0 0 6px;font:700 12px Orbitron,sans-serif;color:var(--blue);letter-spacing:.12em}
.er{position:relative;display:flex;justify-content:space-between;gap:10px;padding:7px 0 9px;font-size:13px}
.er b{font-weight:600}.er i{position:absolute;left:0;bottom:2px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--gold))}
.er.boss span{color:var(--gold)}.er em{font:700 9px Orbitron,sans-serif;font-style:normal;border:1px solid var(--gold);border-radius:4px;padding:0 5px;margin-left:8px}
.er.z{opacity:.35}

/* advisor */
.recs{display:grid;gap:24px;margin-top:12px}
.rc{display:flex;justify-content:space-between;gap:14px;align-items:center;background:#0f1628;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:12px 14px}
.rc .tg{font:700 9px Orbitron,sans-serif;color:var(--c);letter-spacing:.14em}.rc .rt{font:700 13px Orbitron,sans-serif;margin-top:2px}
.rc p{margin:4px 0 0;color:var(--mute);font-size:12.5px}
.rc .gv{font:800 15px Orbitron,sans-serif;color:var(--c);white-space:nowrap;text-align:right}.rc .gv small{display:block;color:var(--mute);font:500 10px Inter,sans-serif;letter-spacing:.06em}
.nd{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.nd i{display:block;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--gold))}.nd b{text-align:right;font-weight:600}
.lvs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.lvs span{font:600 11px Orbitron,sans-serif;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--mute)}
.lvs .up{color:var(--c);border-color:var(--c)}
.chk{display:grid;grid-template-columns:104px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.chk:last-child{border:0}.chk .stt{font:700 9px Orbitron,sans-serif;letter-spacing:.12em;border:1px solid var(--c);color:var(--c);border-radius:4px;padding:3px 6px;text-align:center}
.chk small{color:var(--mute);text-align:right}

/* matrix */
.mxgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.mxr{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;padding:9px 12px;border-radius:10px;border:1px solid transparent;font-size:13px;color:var(--mute)}
.mxr b{font:700 13px Orbitron,sans-serif;color:var(--text)}
.mxr.got{opacity:.45}
.mxr.next{background:rgba(0,180,216,.1);border-color:var(--accent-cyan);color:var(--text);box-shadow:0 0 16px rgba(0,180,216,.2)}
.mxr small{color:var(--gold)}
.bx{padding:10px 0;border-bottom:1px dashed var(--line)}
.bx div{display:flex;justify-content:space-between;font-size:13px}
.bx i{display:block;height:6px;margin-top:8px;border-radius:3px;background:linear-gradient(90deg,var(--accent-cyan),var(--gold))}

@media(max-width:900px){.mxgrid{grid-template-columns:1fr}}
@media(max-width:700px){.shell{padding-left:0;padding-top:64px}.side{inset:0 0 auto 0;width:100%;height:64px;padding:8px 12px}.side:hover{width:100%}.logo{display:none}.sidenav{flex-direction:row;margin:0}.sidenav button span{display:none}.sidenav button{justify-content:center;padding:0}.sidenav button i{margin:0}main{padding:16px}.search{flex-direction:column}.go{padding:14px}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2s}main>section{animation:none}.side{transition:none}}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
  <div class="logo"><b>⚔</b><span>SWORDMASTERS</span></div>
  <nav class="sidenav" role="tablist">
    <button role="tab" aria-selected="true" data-tab="analytics"><i>◈</i><span>Analytics</span></button>
    <button role="tab" aria-selected="false" data-tab="adv"><i>⚙</i><span>Gear Advisor</span></button>
    <button role="tab" aria-selected="false" data-tab="matrix"><i>▦</i><span>Matrix</span></button>
  </nav>
</aside>
<main>
<div class="brand"><h1>SWORDMASTERS <span>COMPANION HUB</span></h1></div>

<section id="analytics" style="margin-top:22px">
  <div class="subtabs"><button class="on" data-sub="search">Player Lookup</button><button data-sub="compare">Compare Players</button></div>
  <section id="search">
    <div class="search">
      <input id="u" type="text" placeholder="Enter a Sword Masters username" maxlength="32" autocomplete="off" aria-label="Username">
      <button class="go" id="go">LOOKUP</button><button class="go alt" id="copyl" style="display:none">COPY LINK</button>
    </div>
    <div id="msg" aria-live="polite"></div>
    <div id="out"></div>
  </section>
  <section id="compare" class="hidden">
    <div class="search"><input id="c1" type="text" placeholder="Player 1" maxlength="32" aria-label="Player 1"><input id="c2" type="text" placeholder="Player 2" maxlength="32" aria-label="Player 2"><button class="go" id="cgo">COMPARE</button></div>
    <div id="cmsg" aria-live="polite"></div><div id="cout"></div>
  </section>
</section>

<section id="adv" class="hidden" style="margin-top:22px">
  <div class="card ibar">
    <label>Username<input id="au" type="text" maxlength="32" placeholder="Enter a username to analyse" aria-label="Username" autocomplete="off"></label>
    <label>Boss<select id="ab"><option value="0">Mordolith</option><option value="1">The Rival</option><option value="2">Reaper</option><option value="3">Dragon</option></select></label>
    <label>Hours per day<input id="ah" type="number" min="0.25" max="24" step="0.25" value="2"></label>
    <label>Days in the plan<input id="ad" type="number" min="1" max="30" value="7"></label>
    <label>Goal<select id="ag"><option value="dps">Damage (DPS)</option><option value="power">Power per day</option><option value="gold">Gold multiplier</option><option value="drops">Drops per day</option><option value="health">Health</option></select></label>
    <label>Sort ideas by<select id="as"><option value="gain">Biggest gain</option><option value="hour">Gain per hour</option></select></label>
    <button class="go" id="ago">ANALYSE</button><button class="go alt" id="acopy" style="display:none">COPY LINK</button>
  </div>
  <div id="amsg" aria-live="polite"></div><div id="aout"></div>
</section>

<section id="matrix" class="hidden" style="margin-top:22px">
  <div class="mxgrid">
    <div class="card gold"><h3>Hit speed breaks</h3>
      <p class="note">hits = 1 + 0.5 × lvl^(1/8). Each row is the level where lvl^(1/8) reaches a whole number.</p>
      <div id="mxL"></div></div>
    <div class="card"><h3>Boss thresholds</h3>
      <p class="note">Boss HP, and the kill time with your last looked-up gear.</p>
      <div id="mxR"></div></div>
  </div>
</section>
</main>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- tabs ---------- */
const TABS=['analytics','adv','matrix'],nav=document.querySelector('.sidenav');
const subtab=s=>{['search','compare'].forEach(x=>$(x).classList.toggle('hidden',x!==s));document.querySelectorAll('.subtabs button').forEach(b=>b.classList.toggle('on',b.dataset.sub===s));};
nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{nav.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',x===b));TABS.forEach(t=>$(t).classList.toggle('hidden',t!==b.dataset.tab));if(b.dataset.tab==='matrix')paintMatrix();});
document.querySelectorAll('.subtabs button').forEach(b=>b.onclick=()=>subtab(b.dataset.sub));

/* ---------- catalog ---------- */
const RAR={C:'Common',R:'Rare',E:'Epic',L:'Legendary'};
const mk=(t,keys)=>t.trim().split('\n').map(l=>{const p=l.split('|');const o={n:p[0],r:RAR[p[1]]};keys.forEach((k,i)=>o[k]=+p[i+2]||0);return o;});
const SW_K=['dmg','prot','hp','gold'],SH_K=['prot','hp','gold','dm'],PET_K=['gold','pow','spd'];

Draco Devil|L|6e9|120e6|15|15
Divinity Edge|L|9e9|300e6|20|20
Last Horizon|L|12e9|400e6|23|23`,SW_K);
const SHIELDS=mk(`Wooden Shield|C|100|0|0|0
Iron Shield|C|250|0|.25|0
Elite Shield|R|500|0|0|.25
Warrior's Shield|R|750|.25|.25|0

Hell Shield|C|250000|3.5|2.5|0

Lord of Hell|E|3e6|5|6|.5
Steel Shield|C|1e6|4.5|2|0

function shareUrl(p,v){const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set(p,v);return u.toString();}
function setShare(p,v,btn){try{history.replaceState(null,'',shareUrl(p,v));}catch(e){}
  const b=$(btn);b.style.display='';b.onclick=()=>{try{navigator.clipboard.writeText(shareUrl(p,v));b.textContent='LINK COPIED';setTimeout(()=>b.textContent='COPY LINK',1500);}catch(e){}};}

/* ---------- matrix ---------- */
function paintMatrix(){
  const inv=LAST?LAST[0]:ADVINV,L=inv?+inv.level||0:0,rws=[];
  for(let n=2;n<=12;n++)rws.push([1+.5*n,Math.pow(n,8)]);
  const nx=rws.findIndex(r=>r[1]>L);
  $('mxL').innerHTML=rws.map(([h,lv],i)=>`<div class="mxr${lv<=L?' got':''}${i===nx?' next':''}"><span>${h.toFixed(2)} hits/s</span><b>Lv ${lv.toLocaleString()}</b><small>${lv<=L?'reached':i===nx&&L?'+'+(lv-L).toLocaleString()+' to go':''}</small></div>`).join('');
  const c=inv?calc(inv):{},mx=Math.log10(Math.max(...PLB.map(b=>b[2])));
  $('mxR').innerHTML=[...PLB].reverse().map(b=>{
    const t=c.dmg?plT(plKill(b[2],c.dmg*c.hits,c.flame||0)):'—';
    return `<div class="bx"><div><span>${b[0]}</span><b>${abbr(b[2])} HP</b></div><i style="width:${Math.log10(b[2])/mx*100}%"></i><div class="note"><span>10 s kill needs ${abbr(b[2]/10)} DPS</span><span>Your kill time: ${t}</span></div></div>`;}).join('');
}
paintMatrix();

/* ---------- open a shared link ---------- */
(function(){const q=new URLSearchParams(location.search),go=t=>{const b=document.querySelector('.sidenav button[data-tab="'+(t==='compare'?'analytics':t)+'"]');b&&b.click();if(t==='compare')subtab('compare');};
  if(q.get('u')){$('u').value=q.get('u');lookup();}
  else if(q.get('adv')){go('adv');$('au').value=q.get('adv');runAdvisor();}
  else if(q.get('cmp')){const p=q.get('cmp').split(',');go('compare');$('c1').value=p[0]||'';$('c2').value=p[1]||'';compare();}})();
</script>
