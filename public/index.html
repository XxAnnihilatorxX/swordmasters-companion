<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwordMasters Companion Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f17;--card:#151927;--line:#242a40;--gold:#ffc83d;--blue:#38b6ff;--text:#e6e9f5;--mute:#8890ab;--bad:#ff5d73}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 400px at 80% -10%,#16304a55,transparent),var(--bg);color:var(--text);font:15px/1.5 Inter,sans-serif;min-height:100vh}
main{max-width:1680px;margin:0 auto;padding:24px 28px 60px}
h1,h2,h3{font-family:Orbitron,sans-serif;margin:0}
h1{font-size:clamp(22px,4vw,34px);font-weight:900;letter-spacing:.04em;color:var(--gold);text-shadow:0 0 18px #ffc83d55}
h1 span{color:var(--blue);text-shadow:0 0 18px #38b6ff55}
h3{font-size:14px;color:var(--blue);margin-bottom:12px;letter-spacing:.06em}
nav{display:flex;gap:8px;margin:22px 0 18px;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;color:var(--mute);font:600 14px Orbitron,sans-serif;padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent}
nav button[aria-selected=true]{color:var(--gold);border-color:var(--gold)}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.search{display:flex;gap:10px}
input[type=text]{flex:1;background:#0a0c13;border:1px solid var(--line);border-radius:8px;color:var(--text);font:500 16px Inter;padding:14px 16px}
input[type=text]:focus{border-color:var(--blue);box-shadow:0 0 0 3px #38b6ff22}
.go{background:var(--gold);color:#1a1300;border:0;border-radius:8px;font:700 14px Orbitron;padding:0 26px;cursor:pointer;box-shadow:0 0 20px #ffc83d44}
.go:disabled{opacity:.5;cursor:wait}
.banner{margin-top:14px;padding:12px 16px;border-radius:8px;border:1px solid var(--bad);background:#ff5d7318;color:#ffb3be}
.loading{margin-top:18px;color:var(--blue);display:flex;gap:10px;align-items:center}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.card.gold h3{color:var(--gold)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border:0}.kv b{font-weight:600;color:var(--text);text-align:right}.kv span{color:var(--mute)}
.empty{color:var(--mute)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:500}
.note{font-size:12.5px;color:var(--mute);margin-top:10px}
.tag{font-size:11px;border:1px solid var(--gold);color:var(--gold);border-radius:99px;padding:1px 8px;margin-left:6px;font-family:Inter}
label.tg{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
label.tg small{display:block;color:var(--mute)}
details{margin-top:18px}summary{cursor:pointer;color:var(--mute)}
pre{background:#0a0c13;border:1px solid var(--line);border-radius:8px;padding:14px;overflow:auto;max-height:360px;font-size:12.5px}
.kills{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 22px;margin-top:8px}
.kr{display:grid;grid-template-columns:90px 1fr 64px;gap:10px;align-items:center;font-size:13px}
.kr span{color:var(--mute)}.kr b{text-align:right;font-weight:600}.kr i{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--gold));display:block}
select{flex:1;min-width:0;background:#0a0c13;border:1px solid var(--line);border-radius:8px;color:var(--text);font:500 14px Inter;padding:12px}
select{background:#0a0c13;border:1px solid var(--line);border-radius:8px;color:var(--text);font:500 15px Inter;padding:0 14px}
.tbl{overflow:auto;max-height:420px;margin-top:10px;font-size:13px}
nav{position:relative;overflow-x:auto;white-space:nowrap}
nav button[aria-selected=true]{border-color:transparent}
.ind{position:absolute;bottom:0;height:2px;background:var(--gold);box-shadow:0 0 12px var(--gold);transition:left .3s ease,width .3s ease}
main>section{animation:fade .35s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.brand{display:flex;gap:14px;align-items:center}.comm{font:700 12px Orbitron;color:var(--blue);letter-spacing:.2em;margin-top:2px}
.who h2{font-size:20px;margin:20px 0 4px}
.hero{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:12px}
.tile{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;padding:14px;text-align:center}
.tile small{color:var(--mute);letter-spacing:.15em;font-size:11px}.tile b{display:block;font:800 26px Orbitron;color:var(--c);margin-top:4px;text-shadow:0 0 14px var(--c)}
h4{margin:16px 0 8px;font:600 11px Orbitron;color:var(--mute);letter-spacing:.15em}
.inv{display:flex;flex-wrap:wrap;gap:10px}
.it{position:relative;width:138px;min-height:96px;background:#0f1322;border:1px solid var(--rc);border-top:4px solid var(--rc);border-radius:8px;padding:8px}
.it.eq{box-shadow:0 0 14px var(--rc)}.it .top{display:flex;justify-content:space-between;font:700 10px Orbitron;color:var(--rc)}
.it .lv{background:#0a0c13;border:1px solid var(--line);color:var(--text);padding:0 6px;border-radius:4px}
.it .nm{font:700 13px Orbitron;margin:10px 0 4px}.it .en{font-size:11px;color:var(--mute)}
.it .x{position:absolute;right:6px;bottom:6px;font:700 11px Orbitron;color:var(--rc);border:1px solid var(--rc);border-radius:4px;padding:0 6px}
.it .eqt{position:absolute;left:8px;bottom:6px;font:700 9px Orbitron;color:var(--gold)}
.win{color:var(--gold);font-weight:700;text-shadow:0 0 10px #ffc83d55}#cout td,#cout th{text-align:center}
input[type=number]{flex:1;min-width:0;background:#0a0c13;border:1px solid var(--line);border-radius:8px;color:var(--text);font:500 15px Inter;padding:12px 14px}
.hero{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{position:relative;overflow:hidden;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,var(--card)),var(--card))}
.tile b{font-size:clamp(20px,3vw,26px)}
.bar{height:5px;border-radius:3px;background:#0a0c13;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c);box-shadow:0 0 8px var(--c)}
.mini{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-top:10px}
.mini div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.mini small{display:block;color:var(--mute);font-size:10.5px;letter-spacing:.14em}.mini b{font:700 16px Orbitron}
.it{width:176px;min-height:150px;margin-top:10px;padding:12px 10px 10px}
.it .st{font-size:11.5px;color:var(--mute);margin-bottom:8px}
.it .eqt{top:-9px;bottom:auto;left:10px;background:var(--bg);padding:0 6px;border-radius:4px}
.it .x{top:-9px;bottom:auto;right:10px;background:var(--bg)}
.sls{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}
.sl{border:1px dashed var(--line);border-radius:6px;padding:4px 2px;text-align:center;opacity:.4}
.sl.on{opacity:1;border:1px solid var(--e);background:color-mix(in srgb,var(--e) 12%,transparent)}
.sl span{display:block;font-size:9px;color:var(--mute)}.sl.on span{color:var(--e)}.sl b{font:700 12px Orbitron}
.mp{width:100%;margin-top:6px;background:#0a0c13;color:var(--text);border:1px solid var(--line);border-radius:6px;font-size:11px;padding:4px}
.sh{font-size:clamp(20px,3vw,28px);text-align:center;margin:8px 0 4px;color:var(--text)}.ssub{text-align:center;color:var(--mute);margin:0 0 6px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.sc{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 12%,var(--card)),var(--card));border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;padding:18px 12px;text-align:center}
.sc.big{max-width:260px;margin:0 auto;padding:26px 14px}
.av{width:58px;height:58px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font:800 22px Orbitron;color:var(--c);border:2px solid var(--c);box-shadow:0 0 18px var(--c);background:#0a0c13}
.sc.big .av{width:74px;height:74px;font-size:28px}
.sc b{display:block;font:700 15px Orbitron}.sc small{display:block;color:var(--c);letter-spacing:.16em;font-size:10px;margin-top:6px}
.wc{background:#0f1322;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.wc h5{margin:0 0 6px;font:700 12px Orbitron;color:var(--blue);letter-spacing:.12em}
.ws{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:12px}
.er{position:relative;display:flex;justify-content:space-between;gap:10px;padding:7px 0 9px;font-size:13px}
.er b{font-weight:600}.er i{position:absolute;left:0;bottom:2px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--gold))}
.er.boss span{color:var(--gold)}.er em,.bt{font:700 9px Orbitron;font-style:normal;border:1px solid var(--gold);border-radius:4px;padding:0 5px;margin-left:8px}
.er.z{opacity:.35}
.sh,.ssub{text-align:left}.sh{margin:8px 0 2px}
.sg{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.sc,.sc.big{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;max-width:none;margin:0}
.sc.big{padding:20px 18px}.av,.sc.big .av{margin:0;flex:none;overflow:hidden}.sc.big .av{width:74px;height:74px}.av img{width:100%;height:100%;object-fit:cover}
.sc small{margin-top:4px}
.wi{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:10px}
.wi label{display:grid;gap:4px;font-size:11px;color:var(--mute);letter-spacing:.08em}
.wi input,.wi select{width:100%;padding:10px 12px;background:#0a0c13;border:1px solid var(--line);border-radius:8px;color:var(--text);font:500 14px Inter}
.bt{font:700 9px Orbitron;font-style:normal;border:1px solid var(--gold);color:var(--gold);border-radius:4px;padding:0 5px;margin-left:6px}
nav{overflow:visible;flex-wrap:wrap;white-space:normal;gap:4px}nav button{padding:10px 12px;font-size:12.5px}.ind{bottom:auto}
.layers{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.layers button{background:var(--card);border:1px solid var(--line);color:var(--mute);border-radius:99px;padding:8px 18px;font:600 12px Orbitron,sans-serif;cursor:pointer;transition:.2s}
.layers button.on{color:var(--gold);border-color:var(--gold);box-shadow:0 0 14px #ffc83d44}
.cg{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:16px}
.egrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.ec{--g:var(--e)}
.gc,.ec{background:linear-gradient(180deg,color-mix(in srgb,var(--g) 10%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--g) 55%,var(--line));border-radius:12px;padding:14px;box-shadow:0 0 18px color-mix(in srgb,var(--g) 26%,transparent)}
.gc.boss{box-shadow:0 0 30px color-mix(in srgb,var(--g) 55%,transparent)}
.gh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.gn{font:700 14px Orbitron,sans-serif;line-height:1.3}
.gr{font:700 9px Orbitron,sans-serif;color:var(--g);border:1px solid var(--g);border-radius:4px;padding:1px 6px;letter-spacing:.1em;white-space:nowrap}
.gw{color:var(--g);font-size:11px;margin-top:3px;letter-spacing:.08em}
.gs{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:12px}
.gs small{display:block;color:var(--mute);font-size:10px;letter-spacing:.1em}.gs b{font:700 14px Orbitron,sans-serif}
.gd{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px;font-size:12px}
.dh{display:block;color:var(--mute);font:600 9px Orbitron,sans-serif;letter-spacing:.14em;margin:6px 0 2px}
.dl{display:flex;justify-content:space-between;gap:10px;padding:2px 0}.dl b{font-weight:600}
.er2{position:relative;display:flex;justify-content:space-between;padding:7px 0 9px;font-size:13px}.er2 b{font-weight:600}
.er2 i{position:absolute;left:0;bottom:2px;height:3px;border-radius:2px;background:var(--e);box-shadow:0 0 8px var(--e)}
.fg2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.fg2 label{font-size:11px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.fg2 input,.fg2 select{width:100%;padding:10px 12px}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.mrow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;padding:6px 10px;background:var(--card)}
.mrow span{flex:1;font-size:13px}.mrow em{font-style:normal;font-size:10px;color:var(--c)}.mrow input{width:76px;flex:none;padding:6px 8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--bad);border-radius:8px;padding:4px 8px;font-size:12px}
.chip select{font-size:11px;padding:3px 6px}
.recs{display:grid;gap:10px;margin-top:12px}
.rc{display:flex;justify-content:space-between;gap:14px;align-items:center;background:#0f1322;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:12px 14px}
.rc .tg{font:700 9px Orbitron,sans-serif;color:var(--c);letter-spacing:.14em}.rc .rt{font:700 13px Orbitron,sans-serif;margin-top:2px}
.rc p{margin:4px 0 0;color:var(--mute);font-size:12.5px}
.rc .gv{font:800 15px Orbitron,sans-serif;color:var(--c);white-space:nowrap;text-align:right}.rc .gv small{display:block;color:var(--mute);font:500 10px Inter,sans-serif;letter-spacing:.06em}
#mapper textarea{width:100%;min-height:60px;background:#0a0c13;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px;margin:10px 0 6px;font:12px monospace}
#mapper td input{width:100%;padding:8px 10px;font-size:13px}
.hidden{display:none}
.check{display:flex;gap:8px;align-items:center;padding:5px 0}
@media(max-width:520px){.search{flex-direction:column}.go{padding:14px}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
</style>
</head>
<body>
<main>
<div class="brand"><div><h1>SWORDMASTERS <span>COMPANION HUB</span></h1><div class="comm hidden" id="comm"></div></div></div>
<nav role="tablist">
  <button role="tab" aria-selected="true" data-tab="search">Player lookup</button>
  <button role="tab" aria-selected="false" data-tab="compare">Compare players</button>
  <button role="tab" aria-selected="false" data-tab="adv">Gear Advisor</button>
  <button role="tab" aria-selected="false" data-tab="drops">Drop finder</button>
  <button role="tab" aria-selected="false" data-tab="lab">Upgrade Lab</button>
  <button role="tab" aria-selected="false" data-tab="info">Game Info</button>
  <button role="tab" aria-selected="false" data-tab="staff">Staff Team</button>
</nav>

<section id="search">
  <div class="search">
    <input id="u" type="text" placeholder="Enter a Sword Masters username" maxlength="32" autocomplete="off" aria-label="Username">
    <button class="go" id="go">LOOKUP</button>
  </div>
  <div id="msg" aria-live="polite"></div>
  <div id="out"></div>
</section>

<section id="compare" class="hidden">
  <div class="search"><input id="c1" type="text" placeholder="Player 1" maxlength="32" aria-label="Player 1"><input id="c2" type="text" placeholder="Player 2" maxlength="32" aria-label="Player 2"><button class="go" id="cgo">COMPARE</button></div>
  <div id="cmsg" aria-live="polite"></div><div id="cout"></div>
</section>
<section id="drops" class="hidden">
  <div class="search"><select id="dm" aria-label="Mode"><option value="enemy">By enemy</option><option value="item">By item</option></select><input id="dq" type="text" placeholder="Search" aria-label="Search drops"></div>
  <div id="dout" class="grid"></div>
</section>
<section id="lab" class="hidden">
  <div class="layers" id="llayers"><button class="on" data-l="npc">NPC Chances</button><button data-l="merge">Merging</button><button data-l="dmg">Damage</button><button data-l="clan">Clan Info</button></div>
  <div id="L-npc">
   <div class="card gold"><h3>Enchanter &amp; Smelter odds</h3>
    <div class="fg2" style="max-width:520px"><label>Player level<input id="lvl" type="number" min="0" value="10000"></label><label>Fortune level<input id="ft" type="number" min="0" max="20" value="0"></label></div>
    <h4>ENCHANTING · ONE SMELTED ORE PER TRY</h4><div class="egrid" id="eo"></div>
    <h4>SMELTING · 10 RAW ORES PER TRY</h4><div class="egrid" id="so"></div></div>
   <div class="card" style="margin-top:14px"><h3>Pet Enhancer</h3>
    <div class="fg2" style="max-width:520px"><label>Pet<select id="pp"><option value="1">XPeppy</option><option value="2">XAxolotl</option><option value="3">XPengoo</option><option value="4">XLeo</option><option value="5">XPhoenix</option><option value="6">XOctoo</option><option value="7">XXen</option><option value="19">XRunix</option></select></label></div><div id="po"></div></div>
  </div>
  <div id="L-merge" class="hidden"><div class="grid">
   <div class="card gold"><h3>Merge calculator</h3><div class="fg2"><label>Target level<input id="mg" type="number" min="2" max="12" value="5"></label></div><div id="mo"></div></div>
   <div class="card"><h3>Dwarfting luck</h3><div class="fg2"><label>Item level<input id="dl" type="number" min="1" value="2"></label><label>Rarity<select id="dr"><option value="1">Common</option><option value="0.8">Rare</option><option value="0.5714285714">Epic</option><option value="0.4">Legendary</option></select></label><label>Fortune level<input id="dft" type="number" min="0" max="20" value="0"></label></div><div id="dwo"></div></div>
  </div></div>
  <div id="L-dmg" class="hidden"><div class="card gold"><h3>Damage calculator</h3>
   <div class="fg2"><label>Power<input id="wp" type="text" value="1.02SXT" placeholder="e.g. 1.02SXT"></label><label>Player level<input id="wl" type="number" min="1" value="27255"></label>
    <label>Sword<select id="ws"></select></label><label>Sword level<input id="wsl" type="number" min="1" value="5"></label><label>Flame level<select id="wf"><option>0</option><option>1</option><option>2</option><option>3</option></select></label>
    <label>Shield<select id="wh"></select></label><label>Shield level<input id="whl" type="number" min="1" value="5"></label></div>
   <div id="wo"></div><button class="go" id="wload" style="padding:10px 16px;margin-top:12px">USE LAST LOOKUP</button></div></div>
  <div id="L-clan" class="hidden"><div class="grid">
   <div class="card gold"><h3>Clan buildings</h3><div class="fg2"><label>Castle<select id="cc0"><option>0</option><option>1</option><option>2</option></select></label><label>Tent 1<select id="cc1"><option>0</option><option>1</option><option>2</option></select></label><label>Tent 2<select id="cc2"><option>0</option><option>1</option><option>2</option></select></label><label>Tent 3<select id="cc3"><option>0</option><option>1</option><option>2</option></select></label><label>Tent 4<select id="cc4"><option>0</option><option>1</option><option>2</option></select></label></div><div id="co"></div></div>
   <div class="card"><h3>Campfire donation</h3><div class="fg2"><label>Base sell value<input id="cg" type="text" value="1e9"></label><label>Item level<input id="cl" type="number" min="1" value="1"></label></div><div id="cf"></div></div>
  </div></div>
</section>
<section id="info" class="hidden">
  <div class="layers" id="gpills"></div>
  <div class="search"><input id="gq" type="text" placeholder="Search" aria-label="Search"><select id="gf" aria-label="Filter"></select></div>
  <div class="cg" id="gt"></div>
</section>
<section id="adv" class="hidden">
  <div class="search"><input id="au" type="text" maxlength="32" placeholder="Enter a username to analyse" aria-label="Username" autocomplete="off"><button class="go" id="ago">ANALYSE</button></div>
  <div id="amsg" aria-live="polite"></div><div id="aout"></div>
</section>
<section id="staff" class="hidden"></section>
</main>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function calc(inv,aS=inv.activeSword,aH=inv.activeShield){
  const P=+inv.power||0,lvl=+inv.level||0;
  const sI=aS&&byId('swords',aS.type),hI=aH&&byId('shields',aH.type),hits=1+.5*Math.pow(lvl,1/8);
  if(!sI||(aH&&!hI))return {hits};
  const DS=sI.dmg*sc(aS),MS=hI?hI.dm*sc(aH):0,r=Math.sqrt(P),dmg=(DS+2*r+1)*(1+MS);
  const fl=(aS.enchantments||[]).find(e=>e.type===0),flame=fl?(2*r+DS)/(10-fl.level)*(1+MS):0;
  return {hits,dmg,flame,dps:dmg*hits+flame};
}
function stacks(list,act,kind){

  (list||[]).forEach(o=>{const k=o.type+'|'+(gear?o.level+'|'+JSON.stringify(o.enchantments||[]):'');const g=m.get(k)||{o,n:0,eq:false};g.n++;if(ids.includes(o.itemId))g.eq=true;m.set(k,g);});
  const key=g=>{const it=byId(kind,g.o.type);return [g.eq?1:0,it?RK[it.r]:0,g.o.level||0,it?CATS[kind].indexOf(it):-1,g.o.type];};
  return [...m.values()].sort((a,b)=>{const x=key(a),y=key(b);for(let i=0;i<x.length;i++)if(x[i]!==y[i])return y[i]-x[i];return 0;});
}

function combat(km){
  const ids=Object.keys(km).map(Number),get=i=>+km[i]||0;
  if(!ids.length)return '<div class="card" style="margin-top:14px"><h3>Combat record</h3><p class="empty">No kill data available.</p></div>';
  const total=ids.reduce((t,i)=>t+get(i),0),boss=[...BOSS].reduce((t,i)=>t+get(i),0),top=[...ids].sort((a,b)=>get(b)-get(a))[0];
  const sum=[['TOTAL KILLS',abbr(total),full(total)],['BOSS KILLS',abbr(boss),full(boss)],['MOST KILLED',(ENEMY_NAMES[top]||'Enemy '+top)+' · '+get(top).toLocaleString(),'']];
  const worlds=WORLDS.map(([w,a,b])=>{const r=[];for(let i=a;i<=b;i++)r.push(i);const mx=Math.max(1,...r.map(get));
    return `<div class="wc"><h5>${w}</h5>${r.map(i=>`<div class="er${BOSS.has(i)?' boss':''}${get(i)?'':' z'}"><span>${esc(ENEMY_NAMES[i]||'Enemy '+i)}${BOSS.has(i)?'<em>BOSS</em>':''}</span><b>${get(i).toLocaleString()}</b><i style="width:${get(i)/mx*100}%"></i></div>`).join('')}</div>`;}).join('');

}

function bestSetup(inv){
  const S=uniq(inv.swords).filter(o=>byId('swords',o.type)),H=uniq(inv.shields).filter(o=>byId('shields',o.type)),res=[];
  S.forEach(a=>H.forEach(b=>{const c=calc(inv,a,b);if(c.dps)res.push([c,a,b]);}));
  if(!res.length)return '';
  res.sort((x,y)=>y[0].dps-x[0].dps);
  const cur=calc(inv).dps||0,nm=(o,k)=>byId(k,o.type).n+' Lv '+o.level;
  const top=res.slice(0,3).map(([c,a,b],i)=>[`${i+1}. ${nm(a,'swords')} + ${nm(b,'shields')}`,abbr(c.dps)+' DPS',full(c.dps)]);
  const gain=cur?(res[0][0].dps/cur-1)*100:0;
  top.push(['Your current setup',cur?abbr(cur)+' DPS':'—',cur?full(cur):'']);
  return `<div class="card" style="margin-top:14px"><h3>Best setup</h3>${rows(top)}<p class="note">${gain>0.05?`Switching to the top pair raises DPS by ${gain.toFixed(1)}%.`:'Your equipped pair is already the best among the items you own.'}</p></div>`;

const BOSSES=[['Mordolith',5e14,6.15],['The Rival',1e14,6.15],['Reaper',3e12,6.15],['Dragon',1e11,11.15]],LOOT=[1,1.6,2.2,2.8,3.4,4,4];
function bossCard(inv){

  const lm=LOOT[Math.min(6,lv(inv.activeSword)+lv(inv.activeShield))];
  const r=BOSSES.map(([n,hp,dt])=>{let lo=0,hi=hp/dn+2;const f=t=>dn*t+F*Math.max(0,Math.floor(t)-1)-hp;
    for(let i=0;i<70;i++){const m=(lo+hi)/2;if(f(m)>=0)hi=m;else lo=m;}
    const k=86400/(hi+dt);
    return `<tr><td>${n}</td><td>${hi<10?hi.toFixed(2):hi.toFixed(1)}s</td><td>${Math.round(k).toLocaleString()}</td><td>${abbr(k*hp*pm)}</td><td>${(k*.01*lm).toFixed(1)}</td></tr>`;}).join('');

}

    if(s2>s1+1e-9)rec.push({tag:'PETS',title:'Equip '+top.map(x=>x.it.n).join(', '),text:`Pet power multipliers add up to ${+s2.toFixed(2)} instead of ${+s1.toFixed(2)}.`,gain:advPc(pm-s1+s2,pm),unit:'POWER'});}
  const cnt=new Map();pets.forEach(p=>cnt.set(p.it.n,(cnt.get(p.it.n)||0)+1));
  const tier=TIER.find(x=>L<=x[0])[1];
  cnt.forEach((n,name)=>{const x=ADXP[name];if(!x||n<10)return;const free=Math.min(100,tier/x[1]*(1+.05*F)),att=Math.floor(n/10);
    rec.push({tag:'ENHANCE',title:`${n} x ${name}: ${att} attempt${att>1?'s':''} at the Pet Enhancer`,text:`Makes ${x[0]}. Free chance ${+free.toFixed(2)}%, paid ${+Math.min(100,free*3).toFixed(2)}%.`,gain:null});});
  const ord={SWAP:0,MERGE:1,ENCHANT:2,PETS:3,ENHANCE:4,TARGET:5};
  rec.sort((a,b)=>(a.tag==='SWAP'?-1:0)-(b.tag==='SWAP'?-1:0)||((b.gain==null?-1:b.gain)-(a.gain==null?-1:a.gain))||ord[a.tag]-ord[b.tag]);
  res.rec=rec;return res;
}
function advHtml(inv){
  const a=advAnalyze(inv);
  const tiles=a.cur?minis([['CURRENT DPS',abbr(a.cur.dps),full(a.cur.dps)],['BEST OWNED SETUP',abbr(a.best.dps),full(a.best.dps)],['POSSIBLE GAIN',a.best.dps>a.cur.dps*1.0005?'+'+(advPc(a.best.dps,a.cur.dps)).toFixed(1)+'%':'Already best'],['IDEAS',a.rec.length]]):'';
  const list=a.rec.map(r=>`<div class="rc" style="--c:${ADTAG[r.tag]}"><div><div class="tg">${r.tag}</div><div class="rt">${esc(r.title)}</div><p>${esc(r.text)}</p></div>${r.gain==null?'':`<div class="gv">${r.gain>=0?'+':''}${Math.abs(r.gain)<10?r.gain.toFixed(1):Math.round(r.gain)}%<small>${r.unit}</small></div>`}</div>`).join('');
  const note=a.ok?'':'<p class="empty" style="margin-top:12px">Some of this player\'s gear is not recognised yet, so damage-based advice is limited.</p>';
  return `<div class="card gold" style="margin-top:14px"><h3>Upgrade advisor</h3>${tiles}${note}<div class="recs">${list||'<p class="empty">Nothing to suggest right now.</p>'}</div></div>`;
}
async function runAdvisor(){
  const n=$('au').value.trim();$('aout').innerHTML='';
  if(!n){$('amsg').innerHTML='<div class="banner">Enter a username first.</div>';return;}
  $('ago').disabled=true;$('amsg').innerHTML='<div class="loading"><div class="spin"></div>Analysing…</div>';
  try{const inv=await getPlayer(n);MAPUI=false;const mk='<div class="card" style="margin-top:14px"><h3>Inventory</h3>',h=buildProfile(inv,n,false);
    $('amsg').innerHTML='';$('aout').innerHTML=h.replace(mk,advHtml(inv)+mk);}
  catch(e){$('amsg').innerHTML=`<div class="banner">${esc(e.message)}</div>`;}finally{$('ago').disabled=false;}
}
$('ago').onclick=runAdvisor;$('au').addEventListener('keydown',e=>{if(e.key==='Enter')runAdvisor();});

</script>
